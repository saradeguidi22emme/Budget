<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">

<title>Budget</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F3F5F8'/%3E%3Crect x='5' y='5' width='22' height='22' fill='none' stroke='%2314181E' stroke-width='2'/%3E%3Crect x='5' y='18' width='22' height='9' fill='%23F07020'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --fondo: #F5F6F8; --carta: #FFFFFF;
    --bordo: #E1E5EB; --bordo-forte: #B8C0CC;
    --testo: #17202B; --testo-2: #586272; --muto: #7B8494;
    --scuro: #17202B;
    --arancio: #F07020; --arancio-ink: #B94A0A; --arancio-soft: #FFF0E6;
    --verde: #18745B; --verde-chiaro: #EAF5F0;
    --giallo: #B95A18; --giallo-chiaro: #FFF4E8;
    --rosso: #A3231B; --rosso-chiaro: #FAE4E1;
    --sans: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
    --serif: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --r: 6px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; color: var(--testo);
    font-family: var(--sans); -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    background-color: var(--fondo);
    background-image: none;
  }
  #app {
    max-width: 440px; margin: 0 auto;
    padding: calc(22px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom));
  }
  #app.con-barra { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  #app.con-azione { padding-bottom: calc(110px + env(safe-area-inset-bottom)); }

  /* navigazione: una riga di riquadri, come le caselle di un cartiglio */
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--carta); border-top: 1px solid var(--bordo);
    padding-bottom: env(safe-area-inset-bottom);
    display: flex; justify-content: center;
  }
  .nav-in {
    width: 100%; max-width: 440px;
    display: grid; grid-template-columns: repeat(5, 1fr);
  }
  .tab {
    background: none; border: none; padding: 10px 0 9px;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    color: var(--muto); position: relative;
  }
  .tab span {
    font-family: var(--mono); font-size: 9px; letter-spacing: .07em;
    text-transform: uppercase; line-height: 1;
  }
  .tab.on { color: var(--testo); }
  .tab.on::before {
    content: ""; position: absolute; top: -1px; left: 50%; transform: translateX(-50%);
    width: 26px; height: 2px; background: var(--arancio);
  }
  .tab.azione { color: var(--testo); }
  .tab.azione i {
    width: 34px; height: 34px; background: var(--scuro); color: #fff;
    display: flex; align-items: center; justify-content: center; border-radius: var(--r);
  }
  .pallino {
    position: absolute; top: 8px; right: 50%; margin-right: -14px;
    width: 6px; height: 6px; background: var(--arancio); border-radius: 50%;
  }

  .testata { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .testata b {
    font-family: var(--mono); font-size: 12px; font-weight: 500;
    letter-spacing: .1em; text-transform: uppercase;
  }
  .tondo {
    background: var(--carta); border: 1px solid var(--bordo); border-radius: var(--r);
    width: 38px; height: 38px; color: var(--testo-2);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  /* i blocchi sono fogli da tavolo tecnico: bordo netto, angoli quasi vivi */
  .gruppo {
    background: var(--carta); border: 1px solid var(--bordo); border-radius: var(--r);
    padding: 2px 16px; margin-bottom: 12px;
  }
  .gruppo.largo { padding: 20px; }
  .gruppo.medio { padding: 14px; }
  .titolo {
    font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--muto);
    margin: 0 0 8px 2px; letter-spacing: .1em; text-transform: uppercase;
  }
  /* cartiglio: etichetta tecnica a sinistra, valore in evidenza a destra */
  .riga {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    padding: 11px 0; border-bottom: 1px solid var(--bordo); font-size: 14px;
  }
  .riga:last-child, .riga.ultima { border-bottom: none; }
  .riga .et {
    font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muto);
  }
  .riga .va { font-variant-numeric: tabular-nums; }
  .riga.forte .va { font-weight: 600; }
  .grande {
    font-family: var(--sans); font-size: 54px; font-weight: 800;
    letter-spacing: -.035em; line-height: .95; margin: 10px 0 6px;
    font-variant-numeric: tabular-nums;
  }
  .grande .cent { font-size: 20px; font-weight: 500; color: var(--arancio); letter-spacing: -.01em; }
  .nota { font-size: 13px; color: var(--testo-2); margin: 0; }
  .piccola { font-size: 12px; color: var(--muto); margin: -4px 2px 20px; line-height: 1.5; }

  /* barra come linea di quota */
  .barra {
    height: 10px; border-radius: 0; background: var(--fondo);
    border: 1px solid var(--bordo); overflow: hidden;
  }
  .barra > div { height: 100%; border-radius: 0; transition: width .4s var(--ease, cubic-bezier(.22,.61,.36,1)); }
  .oggi { position: relative; height: 16px; margin-top: 2px; }
  .oggi i { position: absolute; width: 1px; height: 6px; background: var(--bordo-forte); }
  .oggi span {
    position: absolute; top: 6px; transform: translateX(-50%);
    font-family: var(--mono); font-size: 10px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muto);
  }

  button { font-family: var(--sans); cursor: pointer; }
  .pieno {
    background: var(--scuro); color: #fff; border: 1px solid var(--scuro); border-radius: var(--r);
    padding: 15px 0; font-size: 14px; font-weight: 500; width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .vuoto {
    background: var(--carta); color: var(--testo); border: 1px solid var(--bordo-forte);
    border-radius: var(--r); padding: 15px 20px; font-size: 14px; font-weight: 500;
  }
  .pillola {
    padding: 9px 14px; border-radius: var(--r); font-size: 13px;
    background: var(--carta); color: var(--testo-2); border: 1px solid var(--bordo);
  }
  .pillola.on { background: var(--scuro); color: #fff; border-color: var(--scuro); }
  .pillole { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }

  input, textarea {
    font-family: var(--sans); font-size: 16px; color: var(--testo);
    background: var(--fondo); border: 1px solid var(--bordo); border-radius: var(--r);
    padding: 13px 12px; width: 100%; outline: none;
  }
  input:focus, textarea:focus { border-color: var(--arancio); }
  input.cifra {
    font-family: var(--sans); font-size: 44px; font-weight: 800; letter-spacing: -.035em;
    background: transparent; border: none; padding: 0; border-radius: 0;
    font-variant-numeric: tabular-nums;
  }
  input.cifra:focus { border: none; }
  textarea { resize: none; font-size: 12px; }
  .campo-cifra { display: flex; align-items: baseline; gap: 6px; border-bottom: 1px solid var(--testo); padding-bottom: 8px; }
  .campo-cifra span { font-size: 20px; font-weight: 500; color: var(--arancio); }

  .fondo-fisso {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to top, var(--fondo) 62%, rgba(243,245,248,0));
    padding: 30px 18px calc(18px + env(safe-area-inset-bottom));
    display: flex; justify-content: center; pointer-events: none;
  }
  .fondo-fisso > div { width: 100%; max-width: 440px; pointer-events: auto; }
  .due { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .conti-home { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
  .conto-card { background:var(--carta); border:1px solid var(--bordo); border-radius:var(--r); padding:14px; min-width:0; }
  .conto-card .conto-nome { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600; margin-bottom:13px; }
  .conto-card .conto-saldo { font-size:18px; font-weight:800; letter-spacing:-.03em; overflow-wrap:anywhere; margin-bottom:6px; }
  .conto-card .conto-stato { color:var(--muto); font-size:11px; line-height:1.4; min-height:30px; }
  .conto-card button { margin-top:12px; width:100%; padding:10px 6px; border:1px solid var(--bordo); border-radius:var(--r); background:var(--fondo); color:var(--testo); font-size:12px; }
  .conto-movimento { display:flex; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--bordo); font-size:13px; }
  .conto-movimento:last-child { border-bottom:none; }
  .conti-inline { margin-top:22px; padding-top:17px; border-top:1px solid var(--bordo); }
  .conti-inline-intestazione { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
  .conti-inline-intestazione .titolo { margin:0; font-size:15px; }
  .conti-inline-intestazione button { border:0; background:none; color:var(--testo-2); font-size:12px; padding:4px 0; }
  .conti-inline .conto-card { padding:12px; background:var(--fondo); }
  .conti-inline .conto-card .conto-nome { margin-bottom:8px; font-size:12px; }
  .conti-inline .conto-card .conto-saldo { font-size:17px; margin-bottom:3px; }
  .conti-inline .conto-card .conto-stato { min-height:0; }
  .conti-inline .conto-card button { margin-top:9px; padding:8px 5px; }
  @media (max-width:360px) { .conti-home { grid-template-columns:1fr; } }

  .avviso {
    background: var(--rosso-chiaro); color: var(--rosso); font-size: 13px;
    padding: 12px 14px; border: 1px solid var(--rosso); border-radius: var(--r); margin-bottom: 16px;
  }
  .vuota {
    font-family: var(--mono); font-size: 12px; color: var(--muto);
    margin: 18px 0; text-align: center; letter-spacing: .04em;
  }
  /* categoria: la quota è il riempimento della riga stessa */
  .catriga { padding: 11px 0; border-bottom: 1px solid var(--bordo); }
  .catriga:last-child { border-bottom: none; }
  .catriga .cap {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13px; margin-bottom: 7px; cursor: pointer;
  }
  .catriga .q {
    color: var(--testo-2); font-variant-numeric: tabular-nums;
    display: flex; align-items: center; gap: 7px;
  }
  .catriga small {
    font-family: var(--mono); font-size: 10px; color: var(--muto);
    margin-left: 4px; letter-spacing: .04em;
  }
  .catriga .frec { display: flex; color: var(--muto); transition: transform .25s ease; }
  .catriga.aperta .fill { opacity: .75; }
  .catriga .trac { height: 4px; background: var(--fondo); }
  .catvoci { background: var(--fondo); padding: 2px 12px; margin-top: 6px; }
  .voce {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 0; font-size: 13px; font-variant-numeric: tabular-nums;
    border-bottom: 1px solid var(--fondo);
  }
  .voce:last-child { border-bottom: none; }
  /* fisse: casella di spunta in stile tavola tecnica */
  .fissa {
    display: flex; align-items: center; gap: 11px;
    padding: 11px 0; border-bottom: 1px solid var(--bordo);
    font-size: 14px; cursor: pointer;
  }
  .fissa:last-child { border-bottom: none; }
  .fissa .spunta {
    width: 19px; height: 19px; flex: 0 0 19px;
    border: 1px solid var(--bordo-forte); border-radius: 2px;
    display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .fissa .fnome { flex: 1; }
  .fissa .fnome small {
    font-family: var(--mono); font-size: 10px; letter-spacing: .05em;
    text-transform: uppercase; margin-left: 7px; color: var(--muto);
  }
  .fissa .fimp { font-variant-numeric: tabular-nums; color: var(--testo-2); }
  .fissa.pagata { color: var(--muto); }
  .fissa.pagata .spunta { background: var(--verde); border-color: var(--verde); }
  .fissa.pagata .fimp { color: var(--muto); }
  .fissa.scaduta .spunta { border-color: var(--rosso); }
  .fissa.scaduta .fnome small { color: var(--rosso); }
  .fissa.imminente .spunta { border-color: var(--arancio); }
  .fissa.imminente .fnome small { color: var(--arancio-ink); }
  .tag {
    font-family: var(--mono); font-size: 9px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--verde); border: 1px solid var(--verde); border-radius: 2px;
    padding: 2px 5px; margin-left: 8px; vertical-align: 1px;
  }

  .voce .dt {
    font-family: var(--mono); font-size: 10px; color: var(--muto);
    margin-left: 7px; letter-spacing: .03em;
  }
  .x.chiedi {
    font-family: var(--mono); font-size: 10px; color: var(--rosso);
    letter-spacing: .05em; text-transform: uppercase; white-space: nowrap;
  }
  .modpan { padding: 4px 0 12px; }
  .modcampi { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .modpan label, .pieno-l {
    display: block; font-family: var(--mono); font-size: 10px; color: var(--muto);
    letter-spacing: .07em; text-transform: uppercase; margin-top: 8px;
  }
  .modpan input {
    margin-top: 4px; padding: 11px 10px; font-size: 15px;
    background: var(--carta); border: 1px solid var(--bordo);
  }
  .catriga .fill { height: 100%; background: var(--verde); opacity: .45; transition: width .4s ease; }
  .catriga > span { position: relative; }
  .catriga small {
    font-family: var(--mono); font-size: 10px; color: var(--muto);
    margin-left: 5px; letter-spacing: .04em;
  }
  .catriga .frec { display: flex; color: var(--muto); transition: transform .25s ease; }
  .catriga.aperta .frec { transform: rotate(180deg); }
  .voce {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; font-size: 13px; font-variant-numeric: tabular-nums;
  }
  .catriga .q {
    color: var(--testo-2); font-variant-numeric: tabular-nums;
    display: flex; align-items: center; gap: 7px;
  }

  .x { background: none; border: none; color: var(--bordo-forte); padding: 0; display: flex; }
  .destra { display: flex; align-items: center; gap: 12px; font-variant-numeric: tabular-nums; }
  .link {
    width: 100%; background: var(--carta); border: 1px solid var(--bordo); border-radius: var(--r);
    padding: 15px 16px; display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; color: var(--testo); margin-bottom: 12px;
  }

  /* UX/UI refinement: gerarchia più chiara, superfici morbide e controlli leggibili */
  :root { --r: 16px; }
  body { line-height: 1.45; }
  #app { max-width: 480px; padding-left: 18px; padding-right: 18px; }
  .testata { margin-bottom: 22px; min-height: 38px; }
  .testata b { font-family: var(--sans); font-size: 13px; font-weight: 800; letter-spacing: .12em; }
  .gruppo { border-radius: 16px; border-color: rgba(184,192,204,.72); box-shadow: 0 4px 18px rgba(23,32,43,.035); }
  .gruppo.largo { padding: 22px; }
  .gruppo.medio { padding: 16px; }
  .titolo { font-family: var(--sans); font-size: 10px; font-weight: 700; letter-spacing: .12em; }
  .riga .et { font-family: var(--sans); letter-spacing: .035em; font-size: 11px; }
  .grande { font-size: clamp(46px, 13vw, 58px); letter-spacing: -.055em; }
  .grande .cent { font-size: 19px; }
  .nota { line-height: 1.5; }
  .piccola { line-height: 1.55; }
  .barra { height: 8px; border-radius: 999px; background: #EEF1F4; border: 0; }
  .barra > div { border-radius: 999px; }
  .oggi span { background: var(--carta); padding: 0 5px; }
  .pieno, .vuoto, .pillola, .link { border-radius: 12px; transition: transform .15s ease, box-shadow .15s ease, background-color .15s ease; }
  .pieno { min-height: 48px; font-weight: 700; }
  .pieno:active, .vuoto:active, .pillola:active, .link:active { transform: scale(.985); }
  .vuoto { min-height: 48px; }
  input, textarea { border-radius: 12px; border-color: #DCE2E9; background: #FAFBFC; }
  input:focus, textarea:focus { border-color: var(--arancio); box-shadow: 0 0 0 3px rgba(240,112,32,.13); }
  .nav { background: rgba(255,255,255,.96); border-top: 1px solid rgba(184,192,204,.55); box-shadow: 0 -8px 28px rgba(23,32,43,.055); backdrop-filter: blur(16px); }
  .tab { min-height: 64px; gap: 5px; padding-top: 9px; }
  .tab span { font-family: var(--sans); font-size: 10px; font-weight: 600; letter-spacing: 0; text-transform: none; }
  .tab.on { color: var(--arancio-ink); }
  .tab.on::before { width: 30px; height: 3px; border-radius: 0 0 3px 3px; }
  .tab.azione i { width: 42px; height: 42px; border-radius: 14px; background: var(--arancio); box-shadow: 0 5px 12px rgba(240,112,32,.22); }
  .tondo { border-radius: 12px; }
  .hero-budget { border: 1px solid rgba(184,192,204,.6); background: linear-gradient(145deg, #FFFFFF 0%, #FCFDFE 100%); }
  .hero-budget .grande { margin-top: 12px; margin-bottom: 10px; }
  .hero-budget .barra { margin-top: 8px; }
  .daily-allowance { margin-top: 18px; padding: 13px 14px; border-radius: 12px; background: #F3F6F9; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .daily-allowance span { font-size: 12px; color: var(--testo-2); }
  .daily-allowance strong { font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .daily-allowance small { color: var(--muto); font-size: 10px; font-weight: 500; }
  .card-previsione { position: relative; overflow: hidden; }
  .card-previsione > p[id="previsioneFineCiclo"] { font-weight: 800; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
  .link-azione { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; margin-top: 15px; padding: 13px 14px; border: 1px solid #DCE2E9; border-radius: 12px; background: #F8FAFB; color: var(--testo); font-size: 13px; font-weight: 700; text-align: left; }
  .link-azione span { color: var(--arancio-ink); font-size: 19px; line-height: 1; }
  .card-risparmio { border-color: rgba(24,116,91,.18); }
  .fissa { min-height: 50px; }
  .fissa .spunta { border-radius: 8px; }
  button:focus-visible, [data-a]:focus-visible { outline: 3px solid rgba(240,112,32,.55); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; } }
  @media (max-width: 360px) {
    #app { padding-left: 14px; padding-right: 14px; }
    .gruppo.largo { padding: 18px; }
    .grande { font-size: 44px; }
    .daily-allowance { align-items: flex-start; flex-direction: column; gap: 4px; }
  }


  .conti-riepilogo { margin-top:18px; padding-top:14px; }
  .bper-mini { display:grid; grid-template-columns:1fr auto; align-items:center; gap:3px 12px; padding:13px 15px; border-radius:12px; background:var(--fondo); }
  .bper-mini span { color:var(--testo-2); font-size:12px; }
  .bper-mini strong { font-size:19px; font-variant-numeric:tabular-nums; }
  .bper-mini small { grid-column:1 / -1; color:var(--muto); font-size:11px; }
  .home-dettagli { margin-top:12px; border:1px solid var(--bordo); border-radius:14px; overflow:hidden; background:var(--carta); }
  .home-dettagli > summary { list-style:none; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px; cursor:pointer; font-size:13px; font-weight:600; }
  .home-dettagli > summary::-webkit-details-marker { display:none; }
  .home-dettagli > summary span { color:var(--muto); font-size:11px; font-weight:500; }
  .home-dettagli[open] > summary { border-bottom:1px solid var(--bordo); }
  .home-dettagli-corpo { padding:0 12px 12px; }

</head>
<body>
<div id="app"></div>
<script>
(function () {
  "use strict";

  var CHIAVE = "budget-personale-v3";

  var CATEGORIE = [
    { nome: "Spesa", cosa: "supermercato, mercato" },
    { nome: "Cibo", cosa: "colazioni, pranzi e cene fuori" },
    { nome: "Casa", cosa: "bollette e imprevisti vari" },
    { nome: "Trasporti", cosa: "benzina, biglietti, viaggi, manutenzione auto" },
    { nome: "Svago", cosa: "cinema, concerti, hobby, abbonamenti" },
    { nome: "Cura", cosa: "farmacia, cosmetici, creme" },
    { nome: "Vestiti", cosa: "shopping in generale" },
    { nome: "Varie", cosa: "qualche extra che non sta altrove" }
  ];

  // pagate: { "<id ciclo>": { "<id fissa>": true } } — lo stato vive nel ciclo, non nella fissa,
  // così un ciclo nuovo riparte da sé con tutto "da pagare" senza bisogno di azzeramenti
  var VUOTO = { fisse: [], cuscinetto: 0, risparmiTotali: 0, cicli: [], spese: [], entrate: [], pacchetti: [], pagate: {}, contoAttuale: { nome: "Conto attuale", saldo: null, movimenti: [] }, contoBper: { nome: "BPER", saldo: null, pacMensile: null, commissioni: null, movimenti: [] } };

  var d = null, vista = "home", avviso = null;
  var tipo = "spesa", categoria = "Varie";
  var pacchettoAperto = null, spesaAperta = null, dove = "risparmi", categoriaAperta = null;
  var confermaElim = null, inModifica = null;
  var bozza = {};

  // ---- utilità ----
  function euro(n) {
    return new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" }).format(n || 0);
  }
  function secco(n) { return new Intl.NumberFormat("it-IT", { maximumFractionDigits: 0 }).format(n || 0); }
  function nomePacchettoMensile(a) {
    var mesi = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];
    var data = a && a.id ? new Date(String(a.id).slice(0, 10) + "T12:00:00") : new Date();
    if (isNaN(data.getTime())) data = new Date();
    return "Risparmio " + mesi[data.getMonth()] + " " + data.getFullYear();
  }
  // Le proposte di accantonamento sono sempre arrotondate per difetto a multipli di 50 €.
  function arrotondaSuggerimento(n) { return Math.floor(Math.max(0, n) / 50) * 50; }
  function num(s) { var n = parseFloat(String(s == null ? "" : s).replace(",", ".")); return isNaN(n) ? 0 : n; }
  function arr(n) { return Math.round(n * 100) / 100; }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function oggiISO() {
    var x = new Date();
    return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
  }
  function daISO(s) { var p = String(s).split(".")[0].split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function giornoMese(iso) {
    return daISO(iso).toLocaleDateString("it-IT", { day: "numeric", month: "short" });
  }
  function dataBreve(iso) { return daISO(iso).toLocaleDateString("it-IT", { day: "numeric", month: "long" }); }
  function giorniNelMese(a, m) { return new Date(a, m + 1, 0).getDate(); }
  function prossimaAttesa(iso) {
    var x = daISO(iso);
    return new Date(x.getFullYear(), x.getMonth() + 1, Math.min(x.getDate(), giorniNelMese(x.getFullYear(), x.getMonth() + 1)));
  }
  function occorrenzaDi(g, iso) {
    var i = daISO(iso);
    var x = new Date(i.getFullYear(), i.getMonth(), Math.min(g, giorniNelMese(i.getFullYear(), i.getMonth())));
    if (x < i) x = new Date(i.getFullYear(), i.getMonth() + 1, Math.min(g, giorniNelMese(i.getFullYear(), i.getMonth() + 1)));
    return x;
  }

  // BPER viene aggiornato quando l'utente apre un nuovo ciclo stipendio,
  // non in base al giorno in cui apre l'app. Il saldo è una stima locale, non bancario.
  function applicaImpegniBperNuovoCiclo() {
    var b = d && d.contoBper;
    if (!b || b.saldo == null) return;
    var numeroCiclo = Math.max(0, (d.cicli || []).filter(function (x) { return x.chiuso; }).length);
    // un ciclo già addebitato non viene toccato una seconda volta
    if (b.ultimoCicloAddebitato === numeroCiclo) return;

    var pac = Math.max(0, Number(b.pacMensile) || 0);
    var freqMesi = { mensile: 1, trimestrale: 3, semestrale: 6, annuale: 12 }[b.frequenzaSpesa || "mensile"] || 1;
    var spesa = Math.max(0, Number(b.commissioni) || 0);

    // la spesa esce alla prima chiusura utile e poi ogni freqMesi cicli, contati
    // dall'ultima volta che è uscita: così la cadenza è prevedibile e non dipende
    // da quale numero di ciclo capita
    var fee = 0;
    if (spesa > 0) {
      var ultima = b.ultimoCicloSpesa;
      if (ultima == null || (numeroCiclo - ultima) >= freqMesi) {
        fee = spesa;
        b.ultimoCicloSpesa = numeroCiclo;
      }
    }

    b.saldo = arr(Number(b.saldo) - pac - fee);
    b.ultimoCicloAddebitato = numeroCiclo;
  }

  // ---- dati ----
  function carica() {
    try {
      var g = localStorage.getItem(CHIAVE);
      d = g ? Object.assign({}, VUOTO, JSON.parse(g)) : Object.assign({}, VUOTO);
      // Compatibilità con backup creati prima della gestione dei conti.
      d.contoAttuale = Object.assign({}, VUOTO.contoAttuale, d.contoAttuale || {});
      if (!Array.isArray(d.contoAttuale.movimenti)) d.contoAttuale.movimenti = [];
      d.contoBper = Object.assign({}, VUOTO.contoBper, d.contoBper || {});
      if (!Array.isArray(d.contoBper.movimenti)) d.contoBper.movimenti = [];
      // dati salvati prima di questa versione: allineo il contatore della spesa
      // all'ultimo addebito noto, così la cadenza riparte da lì e non da zero
      if (d.contoBper.ultimoCicloSpesa == null && d.contoBper.ultimoCicloAddebitato != null) {
        d.contoBper.ultimoCicloSpesa = d.contoBper.ultimoCicloAddebitato;
      }
    } catch (e) {
      d = Object.assign({}, VUOTO);
      avviso = "Non riesco a leggere i dati salvati.";
    }
  }
  function salva() {
    try {
      localStorage.setItem(CHIAVE, JSON.stringify(d));
      avviso = null;
    } catch (e) {
      avviso = "Non salvato. Copia il backup dalle impostazioni.";
    }
    render();
  }

  function attivo() { return d.cicli.length ? d.cicli[d.cicli.length - 1] : null; }

  function conti() {
    var a = attivo();
    if (!a) return null;
    var fisse = d.fisse.reduce(function (s, f) { return s + f.importo; }, 0);
    var entrate = arr(d.entrate.filter(function (e) { return e.ciclo === a.id; }).reduce(function (s, x) { return s + x.importo; }, 0));
    var spese = d.spese.filter(function (s) { return s.ciclo === a.id; });
    var speso = arr(spese.reduce(function (s, x) { return s + x.importo; }, 0));
    var budget = arr(a.stipendio + a.riporto + entrate - fisse - d.cuscinetto - a.risparmio);
    var attesa = prossimaAttesa(a.id);
    var durata = Math.max(1, Math.round((attesa - daISO(a.id)) / 86400000));
    return {
      fisse: fisse, entrate: entrate, speso: speso, budget: budget,
      resta: arr(budget - speso), attesa: attesa, durata: durata,
      trascorsi: Math.max(0, Math.round((new Date() - daISO(a.id)) / 86400000)),
      giorni: Math.max(1, Math.ceil((attesa - new Date()) / 86400000)),
      inTasca: arr(d.cuscinetto + arr(budget - speso)),
      spese: spese,
      entrateCiclo: d.entrate.filter(function (e) { return e.ciclo === a.id; }),
      statoFisse: statoFisse(a.id)
    };
  }

  function statoFisse(cicloId) {
    var segnate = (d.pagate || {})[cicloId] || {};
    var oggi = new Date(); oggi.setHours(0, 0, 0, 0);
    return d.fisse.map(function (f) {
      var pagata = !!segnate[f.id];
      var scad = f.giorno ? occorrenzaDi(f.giorno, cicloId) : null;
      var giorni = scad ? Math.round((scad - oggi) / 86400000) : null;
      var stato = pagata ? "pagata"
        : giorni === null ? "attesa"
        : giorni < 0 ? "scaduta"
        : giorni <= 3 ? "imminente"
        : "attesa";
      return { f: f, pagata: pagata, scad: scad, giorni: giorni, stato: stato };
    }).sort(function (a, b) {
      if (a.pagata !== b.pagata) return a.pagata ? 1 : -1;
      if (a.giorni === null) return 1;
      if (b.giorni === null) return -1;
      return a.giorni - b.giorni;
    });
  }

  function daRimettere() {
    return arr((d.pacchetti || []).reduce(function (s, x) { return s + (x.sbloccato || 0); }, 0));
  }

  // ---- pezzi di markup ----
  var ICONA = {
    piu: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    chiudi: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
    ing: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 8a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 3.6 1.65 1.65 0 0010 2.09V2a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 8a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>',
    spunta: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
    giu: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    tabBudget: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16"/><path d="M3 10h18M9 10v10"/></svg>',
    tabSpese: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',
    tabParte: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="13"/><path d="M3 7l2-3h14l2 3M12 11v5"/></svg>',
    tabSet: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M4 13h16M4 19h16"/><circle cx="9" cy="7" r="2" fill="var(--carta)"/><circle cx="15" cy="13" r="2" fill="var(--carta)"/><circle cx="7" cy="19" r="2" fill="var(--carta)"/></svg>',
    x: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>'
  };

  function scarica(nome, testo, tipoMime) {
    try {
      var blob = new Blob([testo], { type: tipoMime + ";charset=utf-8;" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = nome;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      return true;
    } catch (e) { return false; }
  }

  function csv() {
    var campi = ["tipo", "data", "mese", "categoria", "nota", "importo"];
    var fuga = function (v) {
      v = v == null ? "" : String(v);
      return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    };
    var r = [campi.join(";")];
    d.spese.forEach(function (s) {
      r.push([ "spesa", s.data || "", s.ciclo, s.categoria || "", s.nota || "",
        String(s.importo).replace(".", ",") ].map(fuga).join(";"));
    });
    d.entrate.forEach(function (e) {
      r.push([ "entrata", e.data || "", e.ciclo, "", e.nota || "",
        String(e.importo).replace(".", ",") ].map(fuga).join(";"));
    });
    d.fisse.forEach(function (f) {
      r.push([ "fissa", "", "", "", f.nome + (f.giorno ? " (il " + f.giorno + ")" : ""),
        String(f.importo).replace(".", ",") ].map(fuga).join(";"));
    });
    return r.join("\n");
  }

  function navigazione() {
    var voci = [
      ["home", "tabBudget", "Budget"],
      ["elenco", "tabSpese", "Spese"],
      ["__azione__", "piu", ""],
      ["pacchetti", "tabParte", "Da parte"],
      ["impostazioni", "tabSet", "Opzioni"]
    ];
    var dr = daRimettere();
    var h = '<div class="nav"><div class="nav-in">';
    voci.forEach(function (v) {
      if (v[0] === "__azione__") {
        h += '<button class="tab azione" data-a="vaiAggiungi" aria-label="Registra"><i>' + ICONA.piu + '</i></button>';
        return;
      }
      // "conti" è una sottosezione di "Da parte": la tab resta accesa mentre ci sei dentro
      var attiva = (vista === v[0] || (vista === "conti" && v[0] === "pacchetti")) ? " on" : "";
      var segna = v[0] === "pacchetti" && dr > 0 ? '<span class="pallino"></span>' : "";
      h += '<button class="tab' + attiva + '" data-a="vai' + v[0].charAt(0).toUpperCase() + v[0].slice(1) + '">' +
        segna + ICONA[v[1]] + '<span>' + v[2] + '</span></button>';
    });
    return h + '</div></div>';
  }

  function testata(t, azione, senzaX) {
    return '<div class="testata"><b>' + esc(t) + '</b>' +
      (senzaX ? '' : '<button class="tondo" data-a="' + azione + '">' + ICONA.chiudi + '</button>') + '</div>';
  }
  function riga(et, va, colore, forte, ultima) {
    var st = colore ? ' style="color:' + colore + '"' : "";
    return '<div class="riga' + (forte ? " forte" : "") + (ultima ? " ultima" : "") + '">' +
      '<span class="et">' + esc(et) + '</span><span class="va"' + st + '>' + esc(va) + '</span></div>';
  }
  function cifraGrande(n, colore) {
    var intero = secco(Math.floor(Math.abs(n)));
    var cent = String(Math.round((Math.abs(n) % 1) * 100)).padStart(2, "0");
    return '<p class="grande" style="color:' + colore + '">' + intero + '<span class="cent">,' + cent + ' €</span></p>';
  }
  function campoCifra(id, valore, ph) {
    return '<div class="campo-cifra"><input class="cifra" id="' + id + '" inputmode="decimal" value="' +
      esc(valore || "") + '" placeholder="' + (ph || "0,00") + '"><span>€</span></div>';
  }

  // ---- schermate ----
  function vistaPrimoAvvio() {
    return '<p class="titolo" style="margin-top:8px">Per cominciare</p>' +
      '<p style="font-family:var(--serif);font-size:34px;letter-spacing:-.02em;line-height:1.15;margin:10px 0 18px 4px">Quanto è entrato?</p>' +
      '<div class="gruppo largo">' + campoCifra("primo", bozza.primo) + '</div>' +
      '<p class="piccola" style="margin:4px 4px 20px">Il mese parte da oggi e dura finché non registri la prossima entrata. Poi imposta le spese fisse dall\'ingranaggio.</p>' +
      '<button class="pieno" data-a="apriPrimo">Comincia</button>';
  }

  function vistaHome() {
    var a = attivo(), c = conti(), scoperto = c.resta < 0;
    var pct = c.budget > 0 ? Math.min(100, (c.speso / c.budget) * 100) : 0;
    var pctT = Math.min(100, (c.trascorsi / c.durata) * 100);
    var ca = d.contoAttuale || { saldo: null, movimenti: [] };
    var cb = d.contoBper || { saldo: null, movimenti: [] };
    var h = '<div class="testata"><b>Budget</b></div>';

    h += '<div class="gruppo largo hero-budget">' +
      '<p class="titolo" style="margin-left:0">' + (scoperto ? "Sei oltre il budget di" : "Da spendere") + '</p>' +
      cifraGrande(c.resta, scoperto ? "var(--rosso)" : "var(--testo)") +
      '<p class="nota" style="margin-bottom:20px">' +
        (c.giorni === 1 ? "fino a domani" : "fino al " + c.attesa.toLocaleDateString("it-IT", { day: "numeric", month: "long" })) +
      '</p>' +
      '<div class="barra"><div style="width:' + pct + '%;background:' + (scoperto ? "var(--rosso)" : "var(--verde)") + ';opacity:' + (scoperto ? .7 : .45) + '"></div></div>' +
      '<div class="oggi"><i style="left:' + pctT + '%"></i><span style="left:' + pctT + '%">oggi</span></div>' +
      '<p class="nota" style="font-size:12px;margin-top:8px">Speso ' + euro(c.speso) + ' su ' + euro(c.budget) + ' · giorno ' + c.trascorsi + ' di ' + c.durata + '</p>' +
      '<div class="daily-allowance"><span>Ritmo medio disponibile</span><strong>' + euro(c.giorni > 0 ? Math.max(0, c.resta / c.giorni) : 0) + '<small> / giorno</small></strong></div>' +
      '<div class="conti-inline conti-riepilogo"><div class="conti-inline-intestazione"><p class="titolo">BPER</p><button data-a="vaiConti">Apri gestione conti →</button></div>' +
      '<div class="bper-mini"><span>Saldo BPER</span><strong>' + (cb.saldo == null ? '— €' : euro(cb.saldo)) + '</strong><small>' + (cb.saldo == null ? 'Inserisci il saldo iniziale' : 'Aggiornato in base a PAC e spese ricorrenti') + '</small></div>' +
      '<p class="piccola" style="margin:9px 0 0">Il budget qui sopra resta il tuo riferimento per le spese quotidiane.</p></div>' +
      '</div>';


    var previsione = previsioneFineCiclo();
    h += '<details class="home-dettagli"><summary>Previsioni e risparmio <span>Apri</span></summary><div class="home-dettagli-corpo"><div class="gruppo largo card-previsione" style="margin-top:12px">' +
      '<p class="titolo" style="margin-left:0">Previsione a fine ciclo</p>' +
      '<p id="previsioneFineCiclo" style="font-family:var(--serif);font-size:32px;line-height:1.1;margin:10px 0 8px;color:' + (previsione.previsto < 0 ? 'var(--rosso)' : 'var(--verde)') + '">' + euro(previsione.previsto) + '</p>' +
      '<p id="previsioneFineCicloMessaggio" class="piccola" style="margin:0 0 8px">' + (previsione.previsto < 0 ? 'Con l’andamento attuale potresti superare il budget prima del prossimo stipendio.' : 'Saldo spendibile che potresti conservare al prossimo stipendio, se le spese continuano con questo andamento.') + '</p>' +
      '<p id="previsioneFineCicloDettagli" class="piccola" style="margin:0">' + (previsione.affidabile ? 'Media spese registrate: ' + euro(previsione.mediaGiornaliera) + ' al giorno · ' + previsione.giorni + (previsione.giorni === 1 ? ' giorno' : ' giorni') + ' rimanenti' : 'Stima provvisoria: registra alcune spese e lascia passare almeno 3 giorni del ciclo per ottenere una previsione più utile.') + '</p>' +
      '<button class="link-azione" data-a="vaiPacchetti">Valuta quanto mettere da parte <span aria-hidden="true">→</span></button>' +
      '</div>';

    h += '<div class="gruppo card-risparmio" style="background:var(--verde-chiaro);padding:20px">' +

  // Stima orientativa del saldo spendibile a fine ciclo, basata sulle spese
  // variabili registrate finora. Le spese fisse sono già sottratte dal budget.
  function previsioneFineCiclo() {
    var c = conti();
    if (!c) return { disponibile: false, affidabile: false, mediaGiornaliera: 0, previsto: 0, giorni: 0 };
    var trascorsi = Math.max(0, c.trascorsi);
    var giorniOsservati = Math.max(1, trascorsi + 1);
    var media = arr(c.speso / giorniOsservati);
    var abbastanzaDati = trascorsi >= 2 && c.speso > 0;
    var previsto = abbastanzaDati ? arr(c.resta - media * c.giorni) : c.resta;
    return {
      disponibile: true,
      affidabile: abbastanzaDati,
      mediaGiornaliera: media,
      previsto: previsto,
      giorni: c.giorni,
      trascorsi: trascorsi
    };
  }

  // Suggerimento prudente: accantonare al massimo metà del residuo previsto,
  // e solo dopo aver registrato spese sufficienti a stimare un andamento.
  function suggerimentoAccantonamento() {
    var c = conti();
    var previsione = previsioneFineCiclo();
    if (!c || c.resta <= 0) return 0;
    // Nei primi giorni del nuovo ciclo la previsione non è ancora affidabile:
    // proponi una quota prudente basata sul residuo corrente, sempre a multipli di 50 €.
    var base = previsione.affidabile ? previsione.previsto : c.resta;
    if (base <= 0) return 0;
    return arrotondaSuggerimento(Math.min(c.resta, Math.max(0, base * 0.25)));
  }

  // Suggerimento indicativo per il cuscinetto: considera il residuo prima
  // del cuscinetto e le spese registrate; resta una stima prudenziale.
  function suggerimentoCuscinetto() {
    var c = conti();
    if (!c) return 0;
    var primaCuscinetto = arr(c.resta + d.cuscinetto);
    var previsione = previsioneFineCiclo();
    var previstoPrima = previsione.affidabile ? arr(previsione.previsto + d.cuscinetto) : primaCuscinetto;
    // Nel ciclo appena aperto usa una stima prudente provvisoria, non bloccare la funzione.
    var quota = previsione.affidabile ? 0.5 : 0.25;
    return arrotondaSuggerimento(Math.min(Math.max(0, primaCuscinetto), Math.max(0, previstoPrima * quota)));
  }

  // Stima il saldo BPER dopo gli impegni previsti nel mese corrente.
  // Il saldo effettivo resta invariato: questa è solo una proiezione informativa.
  function saldoBperPrevisto() {
    var b = d.contoBper || {};
    if (b.saldo == null) return null;
    var oggi = new Date();
    var mese = oggi.getMonth();
    var anno = oggi.getFullYear();
    var pac = Math.max(0, Number(b.pacMensile) || 0);
    var fee = Math.max(0, Number(b.commissioni) || 0);
    var freq = b.frequenzaSpesa || "mensile";
    var spesaQuestoMese = freq === "mensile" ||
      (freq === "trimestrale" && mese % 3 === 0) ||
      (freq === "semestrale" && mese % 6 === 0) ||
      (freq === "annuale" && mese === 0);
    return arr(Number(b.saldo) - pac - (spesaQuestoMese ? fee : 0));
  }

      '<p class="piccola" style="margin:0 0 4px">Saldo registrato</p><p style="font-family:var(--serif);font-size:30px;line-height:1.1;margin:0 0 16px;color:' + (b.saldo == null ? 'var(--testo-2)' : 'var(--verde)') + '">' + (b.saldo == null ? 'Non impostato' : euro(b.saldo)) + '</p>' +
      '<label class="piccola" for="bperSaldo" style="display:block;margin-bottom:6px">Saldo effettivo BPER</label><input id="bperSaldo" inputmode="decimal" value="' + (b.saldo == null ? '' : esc(String(b.saldo).replace('.', ','))) + '" placeholder="Inserisci il saldo attuale" style="background:var(--carta);border-radius:8px;margin-bottom:14px;width:100%">' +
      '<p class="titolo" style="font-size:15px;margin:0 0 8px">PAC</p>' +
      '<label class="piccola" for="bperPac" style="display:block;margin-bottom:6px">Importo da investire ogni mese, che esce dal saldo</label><input id="bperPac" inputmode="decimal" value="' + (b.pacMensile == null ? '' : esc(String(b.pacMensile).replace('.', ','))) + '" placeholder="Es. 100" style="background:var(--carta);border-radius:8px;margin-bottom:14px;width:100%">' +
      '<p class="titolo" style="font-size:15px;margin:0 0 8px">Spese fisse</p>' +

      '<label class="piccola" for="bperFeeFreq" style="display:block;margin-bottom:6px">Frequenza della spesa</label><select id="bperFeeFreq" style="width:100%;padding:12px;border:1px solid var(--bordo);border-radius:8px;background:var(--carta);margin-bottom:14px"><option value="mensile"' + ((b.frequenzaSpesa || 'mensile') === 'mensile' ? ' selected' : '') + '>Ogni mese</option><option value="trimestrale"' + (b.frequenzaSpesa === 'trimestrale' ? ' selected' : '') + '>Ogni 3 mesi</option><option value="semestrale"' + (b.frequenzaSpesa === 'semestrale' ? ' selected' : '') + '>Ogni 6 mesi</option><option value="annuale"' + (b.frequenzaSpesa === 'annuale' ? ' selected' : '') + '>Una volta l’anno</option></select>' +
      '<button class="pieno" data-a="salvaConti">Salva saldo e spese fisse</button>' +
      '<p class="piccola" style="margin:10px 0 0">A ogni nuovo ciclo il saldo cala del PAC e, quando scade, della spesa fissa. La prima spesa esce alla prima chiusura e poi segue la cadenza scelta. Non c\'è collegamento con la banca: le altre operazioni vanno aggiornate a mano qui.</p></div>';
    h += '<button class="vuoto" style="width:100%;margin-bottom:20px" data-a="vaiHome">Torna alla Home</button>';
    return h;
  }

  // ---- render ----
  function render() {
    var app = document.getElementById("app");
    var attivoEl = document.activeElement;
    var idFocus = attivoEl && attivoEl.id ? attivoEl.id : null;
    var pos = idFocus && attivoEl.selectionStart != null ? attivoEl.selectionStart : null;
    // Conserva i pannelli <details> aperti quando un'azione aggiorna la schermata.
    // Senza questo passaggio, il render sostituisce l'HTML e richiude tutto.
    var vistaPrecedente = vista;
    var dettagliAperti = Array.prototype.map.call(app.querySelectorAll("details"), function (el, i) {
      return el.open ? i : -1;
    }).filter(function (i) { return i >= 0; });

    var corpo;
    if (!attivo()) { corpo = vistaPrimoAvvio(); vista = "home"; }
    else if (vista === "aggiungi") corpo = vistaAggiungi();
    else if (vista === "elenco") corpo = vistaElenco();
    else if (vista === "pacchetti") corpo = vistaPacchetti();
    else if (vista === "nuovoMese") corpo = vistaNuovoMese();
    else if (vista === "impostazioni") corpo = vistaImpostazioni();
    else if (vista === "conti") corpo = vistaConti();
    else corpo = vistaHome();

    var conNav = ["home", "elenco", "pacchetti", "impostazioni", "conti"].indexOf(vista) !== -1 && attivo();
    var conAzione = vista === "aggiungi" || vista === "nuovoMese";
    app.className = conNav ? "con-barra" : (conAzione ? "con-azione" : "");
    app.innerHTML = (avviso ? '<div class="avviso">' + esc(avviso) + '</div>' : "") + corpo +
      (conNav ? navigazione() : "");
    if (vista === vistaPrecedente) {
      Array.prototype.forEach.call(app.querySelectorAll("details"), function (el, i) {
        if (dettagliAperti.indexOf(i) !== -1) el.open = true;
      });
    }

    if (idFocus) {
      var el = document.getElementById(idFocus);
      if (el) { el.focus(); if (pos != null && el.setSelectionRange) try { el.setSelectionRange(pos, pos); } catch (e) {} }
    }
  }

  // ---- azioni ----
  function leggi(id) { var el = document.getElementById(id); return el ? el.value : ""; }

  function chiudiPacchetto(v, recuperaNelBudget) {
    var pac = (d.pacchetti || []).filter(function (x) { return String(x.id) === String(v); })[0];
    if (!pac) { pacchettoAperto = null; confermaElim = null; return render(); }
    var saldoResiduo = arr(Math.max(0, Number(pac.saldo) || 0));

    if (recuperaNelBudget && saldoResiduo > 0) {
      var quotaAccantonata = arr(Math.min(saldoResiduo, Math.max(0, Number(pac.quotaAccantonataResidua) || 0)));
      var cicloCorrente = attivo();
      var cicloOrigine = pac.cicloAccantonamento
        ? (d.cicli || []).filter(function (x) { return x.id === pac.cicloAccantonamento; })[0]
        : null;
      var puoStornareAccantonamento = !!(cicloCorrente && !cicloCorrente.chiuso && cicloOrigine && cicloCorrente.id === cicloOrigine.id);

      if (cicloCorrente) {
        var quotaDaStornare = puoStornareAccantonamento ? quotaAccantonata : 0;
        var extraDaRipristinare = arr(saldoResiduo - quotaDaStornare);
        if (quotaDaStornare > 0) {
          d.cicli = d.cicli.map(function (x) {
            if (x.id !== cicloCorrente.id) return x;
            return Object.assign({}, x, {
              risparmio: arr(Math.max(0, (Number(x.risparmio) || 0) - quotaDaStornare)),
              allocatoPacchetti: arr(Math.max(0, (Number(x.allocatoPacchetti) || 0) - quotaDaStornare))
            });
          });
        }
        if (extraDaRipristinare > 0) {
          d.entrate.push({
            id: Date.now(), importo: extraDaRipristinare,
            nota: "Saldo ripristinato eliminando " + pac.nome,
            ciclo: cicloCorrente.id, categoria: null
          });
        }
      }
    }

    d.pacchetti = (d.pacchetti || []).filter(function (x) { return String(x.id) !== String(v); });
    pacchettoAperto = null;
    confermaElim = null;
    avviso = recuperaNelBudget
      ? (saldoResiduo > 0 ? "Pacchetto eliminato: " + euro(saldoResiduo) + " recuperati nel budget disponibile." : "Pacchetto eliminato.")
      : (saldoResiduo > 0 ? "Pacchetto rimosso dai risparmi gestiti: il budget disponibile non è aumentato." : "Pacchetto eliminato.");
    salva();
  }

  var azioni = {
    vaiHome: function () { vista = "home"; spesaAperta = null; pacchettoAperto = null; render(); },
    vaiAggiungi: function () { vista = "aggiungi"; bozza.importo = ""; bozza.nota = ""; categoria = "Varie"; render(); },
    vaiElenco: function () { vista = "elenco"; render(); },
    vaiPacchetti: function () { vista = "pacchetti"; render(); },
    vaiNuovoMese: function () { vista = "nuovoMese"; bozza.nuovoStip = ""; render(); },
    vaiImpostazioni: function () { vista = "impostazioni"; render(); },
    vaiConti: function () { vista = "conti"; render(); },

    salvaConti: function () {
      var caRaw = leggi("contoAttualeSaldo").trim();
      var saldoRaw = leggi("bperSaldo").trim();
      var pacRaw = leggi("bperPac").trim();
      var feeRaw = leggi("bperFee").trim();
      var feeFreq = leggi("bperFeeFreq") || "mensile";
      var ca = d.contoAttuale || { nome: "Conto attuale", saldo: null, movimenti: [] };
      ca.nome = "Conto attuale";
      ca.saldo = caRaw === "" ? null : arr(num(caRaw));
      if (!Array.isArray(ca.movimenti)) ca.movimenti = [];
      d.contoAttuale = ca;
      var b = d.contoBper || { nome: "BPER", saldo: null, pacMensile: null, commissioni: null, movimenti: [] };
      b.saldo = saldoRaw === "" ? null : arr(num(saldoRaw));
      b.pacMensile = pacRaw === "" ? null : arr(num(pacRaw));
      b.commissioni = feeRaw === "" ? null : arr(num(feeRaw));
      b.frequenzaSpesa = feeFreq;
      b.ultimoCicloAddebitato = Math.max(0, (d.cicli || []).filter(function (x) { return x.chiuso; }).length);
      b.nome = "BPER";
      if (!Array.isArray(b.movimenti)) b.movimenti = [];
      d.contoBper = b;
      avviso = "Impostazioni dei conti salvate. Il budget mensile non è stato modificato.";
      salva();
    },
    tipoSpesa: function () { tipo = "spesa"; render(); },
    tipoEntrata: function () { tipo = "entrata"; render(); },
    cat: function (v) { categoria = v; render(); },
    dove: function (v) { dove = v; render(); },

    apriPrimo: function () {
      var s = num(leggi("primo"));
      if (s <= 0) return;
      d.cicli = [{ id: oggiISO(), stipendio: arr(s), riporto: 0, risparmio: 0, chiuso: false }];
      bozza.primo = ""; salva();
    },

    registra: function () {
      var n = num(leggi("imp"));
      if (n <= 0) return;
      var a = attivo();
      var voce = { id: Date.now(), importo: arr(n), nota: leggi("nota").trim(), ciclo: a.id, data: oggiISO() };
      if (tipo === "spesa") { voce.categoria = categoria; d.spese.push(voce); }
      else d.entrate.push(voce);
      bozza.importo = ""; bozza.nota = ""; categoria = "Varie"; vista = "home"; salva();
    },

    elimSpesa: function (v) {
      if (confermaElim !== "s" + v) { confermaElim = "s" + v; return render(); }
      d.spese = d.spese.filter(function (x) { return String(x.id) !== v; });
      confermaElim = null; inModifica = null; salva();
    },
    elimEntrata: function (v) {
      if (confermaElim !== "e" + v) { confermaElim = "e" + v; return render(); }
      d.entrate = d.entrate.filter(function (x) { return String(x.id) !== v; });
      confermaElim = null; salva();
    },
    elimFissa: function (v) {
      if (confermaElim !== "f" + v) { confermaElim = "f" + v; return render(); }
      d.fisse = d.fisse.filter(function (x) { return String(x.id) !== v; });
      confermaElim = null; salva();
    },
    apriSpesa: function (v) { spesaAperta = spesaAperta === Number(v) ? null : Number(v); confermaElim = null; render(); },
    pagaFissa: function (v) {
      var a = attivo();
      if (!a) return;
      if (!d.pagate) d.pagate = {};
      var c = d.pagate[a.id] ? Object.assign({}, d.pagate[a.id]) : {};
      if (c[v]) delete c[v]; else c[v] = true;
      d.pagate = Object.assign({}, d.pagate, {});
      d.pagate[a.id] = c;
      salva();
    },
    apriCategoria: function (v) { categoriaAperta = categoriaAperta === v ? null : v; spesaAperta = null; render(); },
    modifica: function (v) {
      inModifica = inModifica === Number(v) ? null : Number(v);
      confermaElim = null; render();
    },
    salvaModifica: function (v) {
      var n = num(leggi("mImp"));
      if (n <= 0) { avviso = "L'importo deve essere maggiore di zero."; return render(); }
      var nuovaData = leggi("mData");
      d.spese = d.spese.map(function (x) {
        if (String(x.id) !== v) return x;
        var agg = Object.assign({}, x, { importo: arr(n), nota: leggi("mNota").trim() });
        if (nuovaData) agg.data = nuovaData;
        return agg;
      });
      inModifica = null; spesaAperta = null; avviso = null; salva();
    },
    setCat: function (v, c) {
      d.spese = d.spese.map(function (x) { return String(x.id) === v ? Object.assign({}, x, { categoria: c }) : x; });
      spesaAperta = null; salva();
    },

    nuovaFissa: function () {
      var nome = leggi("fNome").trim(), imp = num(leggi("fImp")), g = parseInt(leggi("fGio"), 10);
      if (!nome || imp <= 0) return;
      d.fisse.push({ id: Date.now(), nome: nome, importo: arr(imp), giorno: g >= 1 && g <= 31 ? g : null });
      bozza.fNome = ""; bozza.fImp = ""; bozza.fGio = ""; salva();
    },

    apriPacchetto: function (v) { pacchettoAperto = pacchettoAperto === Number(v) ? null : Number(v); bozza.mov = ""; render(); },
    nuovoPacchetto: function () {
      var nome = leggi("pacNome").trim();
      if (!nome) return;
      d.pacchetti = (d.pacchetti || []).concat([{ id: Date.now(), nome: nome, saldo: arr(num(leggi("pacSaldo"))), sbloccato: 0 }]);
      bozza.pacNome = ""; bozza.pacSaldo = ""; salva();
    },
    elimPacchetto: function (v) {
      if (confermaElim !== "p" + v) {
        confermaElim = "p" + v;
        return render();
      }
      // Il secondo tap sul pulsante di chiusura annulla la scelta.
      confermaElim = null;
      salva();
    },
    recuperaPacchetto: function (v) { chiudiPacchetto(v, true); },
    rimuoviPacchetto: function (v) { chiudiPacchetto(v, false); },
    sblocca: function (v) { muovi(v, "sblocca"); },
    rimetti: function (v) { muovi(v, "rimetti"); },
    trasferisciBper: function (v) { muovi(v, "trasferisciBper"); },
    usaCuscSuggerito: function () {
      var suggerito = suggerimentoCuscinetto();
      d.cuscinetto = suggerito;
      var campo = document.getElementById("cusc");
      if (campo) campo.value = String(secco(suggerito));
      scriviSoltanto();
      aggiornaBudgetCuscinetto();
    },
    accantonaAuto: function () {
      var n = arr(num(leggi("autoImporto")));
      var nome = String(leggi("autoNomePacchetto") || "").trim();
      var a = attivo(), c = conti();
      if (!a || a.chiuso) { avviso = "Non c’è un ciclo stipendio aperto."; return render(); }
      if (n <= 0) { avviso = "Inserisci un importo maggiore di zero."; return render(); }
      if (n > c.resta) { avviso = "L’importo supera il budget spendibile (" + euro(Math.max(0, c.resta)) + ")."; return render(); }
      if (!nome) { avviso = "Dai un nome al nuovo pacchetto."; return render(); }
      // Crea un pacchetto dedicato e registra lo stesso importo come risparmio del ciclo.
      // allocatoPacchetti evita che questa somma venga conteggiata due volte alla chiusura.
      d.pacchetti = (d.pacchetti || []).concat([{ id: Date.now(), nome: nome, saldo: n, sbloccato: 0, cicloAccantonamento: a.id, quotaAccantonataResidua: n }]);
      d.cicli = d.cicli.map(function (x) {
        return x.id === a.id ? Object.assign({}, x, {
          risparmio: arr((Number(x.risparmio) || 0) + n),
          allocatoPacchetti: arr((Number(x.allocatoPacchetti) || 0) + n)
        }) : x;
      });
      bozza.autoNomePacchetto = "";
      avviso = "Accantonamento registrato e nuovo pacchetto creato.";
      salva();
    },

    chiudiMese: function () {
      var s = num(leggi("nuovoStip"));
      if (s <= 0) return;
      var a = attivo(), c = conti();
      if (a.chiuso) { avviso = "Questo mese è già chiuso."; return render(); }
      // due cicli non possono condividere l'id, o le spese si mescolerebbero
      var nuovoId = oggiISO(), n = 1;
      while (d.cicli.some(function (x) { return x.id === nuovoId; })) { nuovoId = oggiISO() + "." + (++n); }
      var inTasca = c.inTasca;
      var riporto = Math.min(inTasca, d.cuscinetto);
      var ecc = arr(inTasca - riporto);
      var risparmioNonAllocato = Math.max(0, arr((Number(a.risparmio) || 0) - (Number(a.allocatoPacchetti) || 0)));
      d.risparmiTotali = arr(d.risparmiTotali + risparmioNonAllocato + (dove === "risparmi" ? ecc : 0));
      d.cicli = d.cicli.map(function (x) {
        return x.id === a.id ? Object.assign({}, x, { chiuso: true, fine: oggiISO(), inTasca: inTasca, riporto: riporto, eccedenza: ecc, dove: dove }) : x;
      });
      d.cicli.push({
        id: nuovoId, stipendio: arr(s),
        riporto: arr(riporto + (dove === "mese" ? ecc : 0)),
        risparmio: 0, chiuso: false
      });
      applicaImpegniBperNuovoCiclo();
      bozza.nuovoStip = ""; dove = "risparmi"; vista = "home"; salva();
    },

    scaricaCsv: function () {
      if (!scarica("budget-" + oggiISO() + ".csv", "\ufeff" + csv(), "text/csv")) {
        avviso = "Il telefono non ha permesso il download: usa la copia di sicurezza qui sotto.";
        render();
      }
    },
    scaricaBackup: function () {
      if (!scarica("budget-backup-" + oggiISO() + ".json", JSON.stringify(d), "application/json")) {
        avviso = "Il telefono non ha permesso il download: copia il testo qui sotto.";
        render();
      }
    },
    copiaBackup: function () {
      var testo = JSON.stringify(d);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(testo).then(function () {
          avviso = null; bozza.copiato = true; render();
          setTimeout(function () { bozza.copiato = false; render(); }, 2000);
        }, function () { avviso = "Non sono riuscita a copiare: seleziona il testo a mano."; render(); });
      } else {
        avviso = "Copia non disponibile: seleziona il testo a mano."; render();
      }
    },

    ripristina: function () {
      var testo = leggi("ripristino");
      var letto;
      try { letto = JSON.parse(testo); } catch (e) { avviso = "Il testo incollato non è una copia valida."; return render(); }
      if (!letto || !Array.isArray(letto.cicli)) { avviso = "Il testo incollato non è una copia valida."; return render(); }
      if (!bozza.conferma) { bozza.conferma = true; return render(); }
      d = Object.assign({}, VUOTO, letto);
      bozza.ripristino = ""; bozza.conferma = false; vista = "home"; salva();
    }
  };

  function muovi(idPacchetto, verso) {
    var n = arr(num(leggi("mov")));
    if (n <= 0) { avviso = "Inserisci un importo maggiore di zero."; return render(); }
    var a = attivo();
    var pac = (d.pacchetti || []).filter(function (x) { return String(x.id) === String(idPacchetto); })[0];
    if (!pac) return;
    if ((verso === "sblocca" || verso === "trasferisciBper") && n > pac.saldo) {
      avviso = "In " + pac.nome + " ci sono " + euro(pac.saldo) + ": non puoi spostarne di più.";
      return render();
    }
    if (verso === "trasferisciBper") {
      var b = d.contoBper || { nome: "BPER", saldo: null, pacMensile: null, commissioni: null, movimenti: [] };
      if (!Array.isArray(b.movimenti)) b.movimenti = [];
      // Se il saldo iniziale è sconosciuto, registra il movimento senza inventare il saldo complessivo.
      if (b.saldo != null) b.saldo = arr((Number(b.saldo) || 0) + n);
      b.movimenti.push({ id: Date.now(), data: oggiISO(), tipo: "entrata", importo: n, nota: "Trasferimento dal pacchetto " + pac.nome });
      d.contoBper = b;
      d.pacchetti = d.pacchetti.map(function (x) {
        if (String(x.id) !== String(idPacchetto)) return x;
        var quotaResidua = Math.max(0, Number(x.quotaAccantonataResidua) || 0);
        // il denaro cambia solo posto: resta tuo, quindi non va fra i soldi da rimettere
        return Object.assign({}, x, {
          saldo: arr(x.saldo - n),
          quotaAccantonataResidua: arr(Math.max(0, quotaResidua - Math.min(n, quotaResidua)))
        });
      });
      bozza.mov = "";
      avviso = euro(n) + " registrati come trasferiti da “" + pac.nome + "” a BPER. Il budget mensile non cambia; esegui il bonifico dalla tua banca separatamente.";
      salva();
      return;
    }
    if (verso === "sblocca" && n > pac.saldo) {
      avviso = "In " + pac.nome + " ci sono " + euro(pac.saldo) + ": non puoi sbloccarne di più.";
      return render();
    }
    d.pacchetti = d.pacchetti.map(function (x) {
      if (String(x.id) !== String(idPacchetto)) return x;
      if (verso === "sblocca") {
        var quotaResidua = Math.max(0, Number(x.quotaAccantonataResidua) || 0);
        return Object.assign({}, x, {
          saldo: arr(x.saldo - n),
          sbloccato: arr((x.sbloccato || 0) + n),
          quotaAccantonataResidua: arr(Math.max(0, quotaResidua - Math.min(n, quotaResidua)))
        });
      }
      var copre = Math.min(n, x.sbloccato || 0);
      return Object.assign({}, x, { saldo: arr(x.saldo + n), sbloccato: arr((x.sbloccato || 0) - copre) });
    });
    var voce = {
      id: Date.now(), importo: arr(n),
      nota: (verso === "sblocca" ? "Sbloccato da " : "Rimesso in ") + pac.nome,
      ciclo: a.id, categoria: verso === "sblocca" ? null : "Varie"
    };
    if (verso === "sblocca") d.entrate.push(voce); else d.spese.push(voce);
    bozza.mov = ""; salva();
  }

  function aggiornaPrevisioneHome() {
    var output = document.getElementById("previsioneFineCiclo");
    var messaggio = document.getElementById("previsioneFineCicloMessaggio");
    var dettagli = document.getElementById("previsioneFineCicloDettagli");
    var c = conti();
    if (!output || !c) return;
    var previsione = previsioneFineCiclo();
    output.textContent = euro(previsione.previsto);
    output.style.color = previsione.previsto < 0 ? "var(--rosso)" : "var(--verde)";
    if (messaggio) messaggio.textContent = previsione.previsto < 0
      ? "Con l’andamento attuale potresti superare il budget prima del prossimo stipendio."
      : "Saldo spendibile che potresti conservare al prossimo stipendio, se le spese continuano con questo andamento.";
    if (dettagli) dettagli.textContent = previsione.affidabile
      ? "Media spese registrate: " + euro(previsione.mediaGiornaliera) + " al giorno · " + previsione.giorni + (previsione.giorni === 1 ? " giorno" : " giorni") + " rimanenti"
      : "Stima provvisoria: registra alcune spese e lascia passare almeno 3 giorni del ciclo per ottenere una previsione più utile.";
  }

  function aggiornaBudgetCuscinetto() {
    var valore = document.getElementById("cusc");
    var output = document.getElementById("cuscBudgetRimanente");
    var messaggio = document.getElementById("cuscBudgetMessaggio");
    var suggeritoOutput = document.getElementById("cuscSuggerito");
    var c = conti();
    if (!valore || !output || !c) return;
    // conti().resta include già il cuscinetto salvato in d; lo riaggiungiamo
    // per ricostruire il budget prima del cuscinetto, poi sottraiamo il valore digitato.
    var residuo = arr(c.resta + d.cuscinetto - num(valore.value));
    if (suggeritoOutput) {
      suggeritoOutput.textContent = secco(suggerimentoCuscinetto()) + " €";
    }
    output.textContent = euro(residuo);
    if (messaggio) {
      messaggio.textContent = residuo < 0
        ? "Il cuscinetto supera il budget disponibile prima dell’accantonamento."
        : "Questo è il budget che rimane disponibile per le spese del ciclo.";
      messaggio.style.color = residuo < 0 ? "var(--rosso)" : "var(--testo-2)";
    }
  }

  function aggiornaBudgetAccantonamento() {
    var valore = document.getElementById("autoImporto");
    var output = document.getElementById("autoBudgetRimanente");
    var messaggio = document.getElementById("autoBudgetMessaggio");
    if (!valore || !output) return;
    var residuo = arr(conti().resta - num(valore.value));
    output.textContent = euro(residuo);
    if (messaggio) {
      messaggio.textContent = residuo < 0
        ? "L’importo supera il budget disponibile. Riducilo prima di confermare."
        : "Questa cifra resterebbe disponibile per il resto del ciclo.";
      messaggio.style.color = residuo < 0 ? "var(--rosso)" : "var(--testo-2)";
    }
  }

  // ---- eventi ----
  document.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-a]");
    if (!el) return;
    var a = el.getAttribute("data-a");
    if (azioni[a]) azioni[a](el.getAttribute("data-v"), el.getAttribute("data-c"));
  });

  document.addEventListener("input", function (ev) {
    var id = ev.target.id;
    if (!id) return;
    if (id === "risparmio") {
      var a = attivo();
      d.cicli = d.cicli.map(function (x) { return x.id === a.id ? Object.assign({}, x, { risparmio: arr(num(ev.target.value)) }) : x; });
      scriviSoltanto();
      aggiornaPrevisioneHome();
    } else if (id === "cusc") { d.cuscinetto = num(ev.target.value); scriviSoltanto(); aggiornaBudgetCuscinetto(); }
    else if (id === "stip") {
      var b = attivo();
      d.cicli = d.cicli.map(function (x) { return x.id === b.id ? Object.assign({}, x, { stipendio: num(ev.target.value) }) : x; });
      scriviSoltanto();
      aggiornaBudgetCuscinetto();
    }
    else if (id === "imp") { bozza.importo = ev.target.value; render(); }
    else if (id === "nota") bozza.nota = ev.target.value;
    else if (id === "primo") bozza.primo = ev.target.value;
    else if (id === "nuovoStip") bozza.nuovoStip = ev.target.value;
    else if (id === "mov") bozza.mov = ev.target.value;
    else if (id === "autoImporto") { aggiornaBudgetAccantonamento(); }
    else if (id === "autoNomePacchetto") bozza.autoNomePacchetto = ev.target.value;
    else if (id === "contoAttualeSaldo" || id === "bperSaldo" || id === "bperPac" || id === "bperFee" || id === "bperFeeFreq") { /* letti al salvataggio */ }
    else if (id === "mImp" || id === "mNota" || id === "mData") { /* letti al salvataggio */ }
    else if (id === "fNome") bozza.fNome = ev.target.value;
    else if (id === "fImp") bozza.fImp = ev.target.value;
    else if (id === "fGio") bozza.fGio = ev.target.value.replace(/[^0-9]/g, "").slice(0, 2);
    else if (id === "pacNome") bozza.pacNome = ev.target.value;
    else if (id === "pacSaldo") bozza.pacSaldo = ev.target.value;
    else if (id === "ripristino") {
      var prima = (bozza.ripristino || "").trim().length > 0;
      bozza.ripristino = ev.target.value;
      bozza.conferma = false;
      // il pulsante esiste solo con del testo: ridisegno quando compare o sparisce
      if (prima !== (bozza.ripristino.trim().length > 0)) render();
    }
  });

  // scrive senza ridisegnare: evita che la tastiera si chiuda mentre digiti
  var attesa = null;
  function scriviSoltanto() {
    clearTimeout(attesa);
    attesa = setTimeout(function () {
      try { localStorage.setItem(CHIAVE, JSON.stringify(d)); } catch (e) {}
    }, 300);
  }

  document.addEventListener("focusout", function (ev) {
    if (ev.target.id === "risparmio") {
      var ciclo = attivo();
      if (ciclo) {
        var minimo = Number(ciclo.allocatoPacchetti) || 0;
        if ((Number(ciclo.risparmio) || 0) < minimo) {
          d.cicli = d.cicli.map(function (x) {
            return x.id === ciclo.id ? Object.assign({}, x, { risparmio: minimo }) : x;
          });
          try { localStorage.setItem(CHIAVE, JSON.stringify(d)); } catch (e) {}
          avviso = "Il risparmio mensile non può scendere sotto la somma già assegnata ai pacchetti.";
        }
      }
    }
    if (["risparmio", "cusc", "stip"].indexOf(ev.target.id) !== -1) render();
  });

  document.addEventListener("focusin", function (ev) {
    if (ev.target.id === "backup") ev.target.select();
  });

  carica();
  render();
})();
</script>
</body>
</html>
